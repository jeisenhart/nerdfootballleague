<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old Man's Nerd Football League</title>
    <!-- Tailwind CSS CDN for fast, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            scroll-behavior: smooth;
        }
        /* Dropdown hover utility */
        .group:hover .dropdown-menu {
            display: block;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header / Navigation (Sticky at Top) -->
    <header class="sticky top-0 z-50 bg-stone-900/95 backdrop-blur-md border-b border-stone-800 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center">
            <div class="flex items-center space-x-3 mb-2 sm:mb-0">
                <span class="text-2xl font-black tracking-wider text-amber-500 uppercase">OMNFL</span>
            </div>
            <nav class="flex items-center space-x-6 text-sm font-semibold uppercase tracking-wide text-stone-300">
                <a href="index.html" class="hover:text-amber-400 transition">Home</a>
                
                <!-- Recruiting Rules with Dropdown -->
                <div class="relative group py-2">
                    <a href="recruiting.html" class="hover:text-amber-400 transition flex items-center gap-1">
                        Recruiting Rules
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </a>
                    <!-- Sub-menu -->
                    <div class="dropdown-menu hidden absolute left-0 mt-2 w-48 bg-stone-900 border border-stone-800 rounded-lg shadow-xl py-2 z-50">
                        <a href="recruiting.html#regular-season" class="block px-4 py-2 text-xs text-stone-300 hover:bg-amber-600/20 hover:text-amber-400 transition">Regular Season</a>
                        <a href="recruiting.html#transfer-portal" class="block px-4 py-2 text-xs text-stone-300 hover:bg-amber-600/20 hover:text-amber-400 transition">Transfer Portal</a>
                        <a href="states.html" class="block px-4 py-2 text-xs text-stone-300 hover:bg-amber-600/20 hover:text-amber-400 transition">Neighboring States</a>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="home" class="flex-grow">
        <!-- Hero Section -->
        <section class="max-w-5xl mx-auto px-4 py-12 md:py-20 text-center">
            <h1 class="text-4xl md:text-6xl font-extrabold text-white tracking-tight mb-4">
                Old Man's Nerd Football League
            </h1>
            <p class="text-stone-400 text-lg md:text-xl max-w-2xl mx-auto mb-8">
                Where gridiron strategy meets veteran calculation. Welcome to the official hub of the league.
            </p>

            <!-- Logo Display Container -->
            <div class="max-w-md mx-auto bg-stone-900/80 border-4 border-amber-600/50 rounded-2xl p-6 shadow-2xl mb-12 backdrop-blur-sm">
                <img src="images/nerd-logo.png" alt="Old Man's Nerd Football League Logo" class="w-full h-auto drop-shadow-lg">
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-stone-900 border-t border-stone-800 py-6 text-center text-stone-500 text-sm">
        <p>&copy; 2026 Old Man's Nerd Football League. All rights reserved.</p>
    </footer>

</body>
</html>
